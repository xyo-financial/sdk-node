<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%" style="background-color: #0B0F19; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>
    <linearGradient id="activeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="maintGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="eolGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F87171" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
    <linearGradient id="brandAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="milestoneLineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="1" />
      <stop offset="50%" stop-color="#00D2FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.2" />
    </linearGradient>

    <!-- Filters -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtleShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Card Frame -->
  <rect x="1" y="1" width="998" height="518" rx="16" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2" />

  <!-- Card Top Accent Bar -->
  <path d="M 16 2 L 984 2" stroke="url(#brandAccent)" stroke-width="3" stroke-linecap="round" />

  <!-- Header Section -->
  <g transform="translate(40, 42)">
    <!-- Brand Pill -->
    <rect x="0" y="0" width="118" height="22" rx="11" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="59" y="15" fill="#00D2FF" font-size="10" font-weight="700" letter-spacing="1.5" text-anchor="middle">XYO FINANCIAL</text>

    <!-- Title and Subtitle -->
    <text x="0" y="48" fill="#F8FAFC" font-size="20" font-weight="700" letter-spacing="-0.3">Node.js Runtime Lifecycle &amp; LTS Support Schedule</text>
    <text x="0" y="70" fill="#94A3B8" font-size="12" font-weight="400">Proactive LTS baseline alignment, active maintenance tracking, and EOL roadmap (2023–2028)</text>
  </g>

  <!-- Timeline Grid & Headers -->
  <!-- Timeline bounds: X from 180 to 948 (768px total width = 6 years @ 128px/yr) -->
  <g transform="translate(0, 135)">
    <!-- Year Grid Lines & Labels -->
    <!-- 2023 -->
    <line x1="180" y1="0" x2="180" y2="255" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4" />
    <text x="180" y="-8" fill="#64748B" font-size="12" font-weight="600" text-anchor="middle">2023</text>

    <!-- 2024 -->
    <line x1="308" y1="0" x2="308" y2="255" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4" />
    <text x="308" y="-8" fill="#64748B" font-size="12" font-weight="600" text-anchor="middle">2024</text>

    <!-- 2025 -->
    <line x1="436" y1="0" x2="436" y2="255" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4" />
    <text x="436" y="-8" fill="#64748B" font-size="12" font-weight="600" text-anchor="middle">2025</text>

    <!-- 2026 -->
    <line x1="564" y1="0" x2="564" y2="255" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4" />
    <text x="564" y="-8" fill="#64748B" font-size="12" font-weight="600" text-anchor="middle">2026</text>

    <!-- 2027 -->
    <line x1="692" y1="0" x2="692" y2="255" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4" />
    <text x="692" y="-8" fill="#64748B" font-size="12" font-weight="600" text-anchor="middle">2027</text>

    <!-- 2028 -->
    <line x1="820" y1="0" x2="820" y2="255" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4" />
    <text x="820" y="-8" fill="#64748B" font-size="12" font-weight="600" text-anchor="middle">2028</text>

    <!-- 2029 End Line -->
    <line x1="948" y1="0" x2="948" y2="255" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4" />
    <text x="948" y="-8" fill="#64748B" font-size="12" font-weight="600" text-anchor="middle">2029</text>
  </g>

  <!-- Version Rows Container -->
  <!-- Row 1: Node.js 18 -->
  <g transform="translate(0, 145)">
    <!-- Label -->
    <text x="40" y="24" fill="#F1F5F9" font-size="13" font-weight="700">Node.js 18</text>
    <rect x="114" y="10" width="46" height="18" rx="4" fill="#3B1219" stroke="#EF4444" stroke-width="1" />
    <text x="137" y="23" fill="#F87171" font-size="9" font-weight="700" text-anchor="middle">EOL</text>

    <!-- Active Bar (Jan 2023 - Oct 2023): X=180, Width=96 -->
    <rect x="180" y="8" width="96" height="24" rx="4" fill="url(#activeGrad)" filter="url(#subtleShadow)"/>
    <text x="228" y="24" fill="#0B0F19" font-size="10" font-weight="700" text-anchor="middle">Active</text>

    <!-- Maintenance Bar (Oct 2023 - Apr 2025): X=276, Width=203 -->
    <rect x="276" y="8" width="203" height="24" rx="4" fill="url(#maintGrad)" filter="url(#subtleShadow)"/>
    <text x="377" y="24" fill="#0B0F19" font-size="10" font-weight="700" text-anchor="middle">Maintenance LTS</text>

    <!-- EOL Marker / Line (Apr 2025 -> end) -->
    <line x1="479" y1="8" x2="479" y2="32" stroke="#EF4444" stroke-width="2" />
    <circle cx="479" cy="20" r="4" fill="#EF4444" />
    <text x="488" y="24" fill="#EF4444" font-size="10" font-weight="600">EOL: Apr 2025</text>
  </g>

  <!-- Row 2: Node.js 20 LTS -->
  <g transform="translate(0, 205)">
    <!-- Label -->
    <text x="40" y="24" fill="#F1F5F9" font-size="13" font-weight="700">Node.js 20 LTS</text>
    <rect x="130" y="10" width="40" height="18" rx="4" fill="#2E1B0F" stroke="#F59E0B" stroke-width="1" />
    <text x="150" y="23" fill="#FBBF24" font-size="9" font-weight="700" text-anchor="middle">BASE</text>

    <!-- Active Bar (Apr 2023 - Oct 2024): X=223, Width=181 -->
    <rect x="223" y="8" width="181" height="24" rx="4" fill="url(#activeGrad)" filter="url(#subtleShadow)"/>
    <text x="313" y="24" fill="#0B0F19" font-size="10" font-weight="700" text-anchor="middle">Active LTS</text>

    <!-- Maintenance Bar (Oct 2024 - Apr 2026): X=404, Width=203 -->
    <rect x="404" y="8" width="203" height="24" rx="4" fill="url(#maintGrad)" filter="url(#subtleShadow)"/>
    <text x="505" y="24" fill="#0B0F19" font-size="10" font-weight="700" text-anchor="middle">Maintenance LTS</text>

    <!-- EOL Marker (Apr 2026) -->
    <line x1="607" y1="8" x2="607" y2="32" stroke="#EF4444" stroke-width="2" />
    <circle cx="607" cy="20" r="4" fill="#EF4444" />
    <text x="616" y="24" fill="#EF4444" font-size="10" font-weight="600">EOL: Apr 2026</text>
  </g>

  <!-- Row 3: Node.js 22 LTS -->
  <g transform="translate(0, 265)">
    <!-- Label -->
    <text x="40" y="24" fill="#F1F5F9" font-size="13" font-weight="700">Node.js 22 LTS</text>
    <rect x="130" y="10" width="40" height="18" rx="4" fill="#063524" stroke="#10B981" stroke-width="1" />
    <text x="150" y="23" fill="#34D399" font-size="9" font-weight="700" text-anchor="middle">REC</text>

    <!-- Active Bar (Apr 2024 - Oct 2025): X=351, Width=181 -->
    <rect x="351" y="8" width="181" height="24" rx="4" fill="url(#activeGrad)" filter="url(#subtleShadow)"/>
    <text x="441" y="24" fill="#0B0F19" font-size="10" font-weight="700" text-anchor="middle">Active LTS</text>

    <!-- Maintenance Bar (Oct 2025 - Apr 2027): X=532, Width=203 -->
    <rect x="532" y="8" width="203" height="24" rx="4" fill="url(#maintGrad)" filter="url(#subtleShadow)"/>
    <text x="633" y="24" fill="#0B0F19" font-size="10" font-weight="700" text-anchor="middle">Maintenance LTS</text>

    <!-- EOL Marker (Apr 2027) -->
    <line x1="735" y1="8" x2="735" y2="32" stroke="#64748B" stroke-width="2" stroke-dasharray="2 2"/>
    <circle cx="735" cy="20" r="4" fill="#64748B" />
    <text x="744" y="24" fill="#94A3B8" font-size="10" font-weight="500">EOL: Apr 2027</text>
  </g>

  <!-- Row 4: Node.js 24 LTS -->
  <g transform="translate(0, 325)">
    <!-- Label -->
    <text x="40" y="24" fill="#F1F5F9" font-size="13" font-weight="700">Node.js 24 LTS</text>
    <rect x="130" y="10" width="40" height="18" rx="4" fill="#082F49" stroke="#00D2FF" stroke-width="1" />
    <text x="150" y="23" fill="#38BDF8" font-size="9" font-weight="700" text-anchor="middle">NEXT</text>

    <!-- Active Bar (Apr 2025 - Oct 2026): X=479, Width=181 -->
    <rect x="479" y="8" width="181" height="24" rx="4" fill="url(#activeGrad)" filter="url(#subtleShadow)"/>
    <text x="569" y="24" fill="#0B0F19" font-size="10" font-weight="700" text-anchor="middle">Active LTS</text>

    <!-- Maintenance Bar (Oct 2026 - Apr 2028): X=660, Width=203 -->
    <rect x="660" y="8" width="203" height="24" rx="4" fill="url(#maintGrad)" filter="url(#subtleShadow)"/>
    <text x="761" y="24" fill="#0B0F19" font-size="10" font-weight="700" text-anchor="middle">Maintenance LTS</text>

    <!-- EOL Marker (Apr 2028) -->
    <line x1="863" y1="8" x2="863" y2="32" stroke="#64748B" stroke-width="2" stroke-dasharray="2 2"/>
    <circle cx="863" cy="20" r="4" fill="#64748B" />
    <text x="872" y="24" fill="#94A3B8" font-size="10" font-weight="500">EOL: Apr 2028</text>
  </g>

  <!-- Current Milestone Line: August 2026 (X = 644) -->
  <g>
    <!-- Glowing vertical marker line -->
    <line x1="644" y1="120" x2="644" y2="395" stroke="url(#milestoneLineGrad)" stroke-width="2" filter="url(#cyanGlow)" />
    <line x1="644" y1="120" x2="644" y2="395" stroke="#00D2FF" stroke-width="2" stroke-dasharray="4 2" />

    <!-- Current Milestone Top Badge -->
    <g transform="translate(644, 112)">
      <rect x="-65" y="-18" width="130" height="22" rx="11" fill="#0B0F19" stroke="#00D2FF" stroke-width="1.5" filter="url(#cyanGlow)" />
      <circle cx="-48" cy="-7" r="4" fill="#00D2FF" />
      <text x="8" y="-4" fill="#00D2FF" font-size="10" font-weight="800" letter-spacing="0.5" text-anchor="middle">CURRENT (2026)</text>
    </g>
  </g>

  <!-- Legend Section -->
  <g transform="translate(40, 425)">
    <!-- Legend Card Background -->
    <rect x="0" y="0" width="920" height="58" rx="8" fill="#131C2E" stroke="#1E293B" stroke-width="1" />

    <!-- Legend Items -->
    <!-- Active Support -->
    <rect x="25" y="20" width="18" height="18" rx="4" fill="url(#activeGrad)" />
    <text x="51" y="34" fill="#E2E8F0" font-size="12" font-weight="600">Active Support / LTS</text>

    <!-- Maintenance LTS -->
    <rect x="205" y="20" width="18" height="18" rx="4" fill="url(#maintGrad)" />
    <text x="231" y="34" fill="#E2E8F0" font-size="12" font-weight="600">Maintenance LTS</text>

    <!-- End of Life (EOL) -->
    <rect x="375" y="20" width="18" height="18" rx="4" fill="url(#eolGrad)" />
    <text x="401" y="34" fill="#E2E8F0" font-size="12" font-weight="600">End-of-Life (EOL)</text>

    <!-- Current Timeline Marker -->
    <line x1="535" y1="20" x2="535" y2="38" stroke="#00D2FF" stroke-width="3" stroke-dasharray="3 1" />
    <circle cx="535" cy="29" r="4" fill="#00D2FF" />
    <text x="548" y="34" fill="#E2E8F0" font-size="12" font-weight="600">Current Milestone (Aug 2026)</text>

    <!-- Policy Guarantee Note -->
    <rect x="740" y="14" width="165" height="30" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="822" y="33" fill="#38BDF8" font-size="11" font-weight="700" text-anchor="middle">Baseline: Node 20 LTS+</text>
  </g>
</svg>
