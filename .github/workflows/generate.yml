name: Generate Node SDK

on:
  repository_dispatch:
    types: [spec_updated]
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SDK Repository
        uses: actions/checkout@v4

      - name: Checkout OpenAPI Spec
        uses: actions/checkout@v4
        with:
          repository: xyo-financial/specs
          path: specs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate API Client
        run: |
          # Clean previous generated code
          rm -rf src/generated
          
          # Run openapi-generator
          npx -y @openapitools/openapi-generator-cli generate \
            -i specs/openapi.yml \
            -g typescript-fetch \
            -o ./src/generated
            
          # Clean up the spec folder so it doesn't get committed
          rm -rf specs

      - name: Install Dependencies
        run: npm ci

      - name: Build SDK
        run: npm run build

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update generated Node SDK from latest OpenAPI spec"
          title: "Automated SDK Update"
          body: "This PR automatically updates the generated `typescript-fetch` client based on the latest `openapi.yml` specification."
          branch: "chore/auto-update-sdk"
          delete-branch: true
